      <g transform="rotate(45 256 256)"><rect x="250" y="110" width="12" height="114" rx="6"/><rect x="249" y="80" width="14" height="24" rx="3"/><circle cx="256" cy="72" r="16"/></g>
      <g transform="rotate(90 256 256)"><rect x="250" y="110" width="12" height="114" rx="6"/><rect x="249" y="80" width="14" height="24" rx="3"/><circle cx="256" cy="72" r="16"/></g>
      <g transform="rotate(135 256 256)"><rect x="250" y="110" width="12" height="114" rx="6"/><rect x="249" y="80" width="14" height="24" rx="3"/><circle cx="256" cy="72" r="16"/></g>
      <g transform="rotate(180 256 256)"><rect x="250" y="110" width="12" height="114" rx="6"/><rect x="249" y="80" width="14" height="24" rx="3"/><circle cx="256" cy="72" r="16"/></g>
      <g transform="rotate(225 256 256)"><rect x="250" y="110" width="12" height="114" rx="6"/><rect x="249" y="80" width="14" height="24" rx="3"/><circle cx="256" cy="72" r="16"/></g>
      <g transform="rotate(270 256 256)"><rect x="250" y="110" width="12" height="114" rx="6"/><rect x="249" y="80" width="14" height="24" rx="3"/><circle cx="256" cy="72" r="16"/></g>
      <g transform="rotate(315 256 256)"><rect x="250" y="110" width="12" height="114" rx="6"/><rect x="249" y="80" width="14" height="24" rx="3"/><circle cx="256" cy="72" r="16"/></g>
      <circle cx="256" cy="256" r="38"/>
    </g>
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="24"/>
    <circle cx="256" cy="256" r="126" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle cx="256" cy="256" r="20" fill="#6E3A1C"/>
