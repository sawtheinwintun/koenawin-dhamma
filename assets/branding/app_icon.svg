<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="yogi" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#8E5230"/>
      <stop offset="100%" stop-color="#5A2E16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6CB7E"/>
      <stop offset="50%" stop-color="#C29A45"/>
      <stop offset="100%" stop-color="#8F6A28"/>
